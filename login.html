<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediReady - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0d52a2;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .logo-area img.logo {
            width: 80px;
            height: auto;
            margin-bottom: 15px;
        }

        .logo-area h1 {
            color: #0d52a2;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .logo-area p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #0d52a2;
        }

        button.btn-login {
            width: 100%;
            padding: 14px;
            background-color: #0d52a2;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button.btn-login:hover {
            background-color: #083c79;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo-area">
            <img src="Images/Logo.png" class="logo" alt="MediReady Logo" onerror="this.style.display='none'">
            <h1>MediReady</h1>
            <p>Monitoring Alat Emergency</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Masukkan Username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Masukkan Password" required>
            </div>

            <button type="submit" class="btn-login">LOGIN</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Pengaturan Password
            const correctUser = "mediready";
            const correctPass = "ruvbpp";

            if (user === correctUser && pass === correctPass) {
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('username', user);
                window.location.href = 'dashboard.html';
            } else {
                alert('Username atau Password salah! (Default: admin / 12345)');
            }
        });
    </script>
</body>

</html>
